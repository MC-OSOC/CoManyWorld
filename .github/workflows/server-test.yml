# Starts a real Paper and Spigot server on GitHub's runner with the plugin installed,
# types the plugin's commands into the server console and checks the answers
# (create, list, backup, import, restart, delete, clear). See .github/scripts/server-smoke-test.sh
#
# Runs on every push that changes the plugin, or by hand:
#   Actions -> Server test -> Run workflow -> Minecraft version (e.g. 26.3 or 1.21.11)
name: Server test

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/server-test.yml'
      - '.github/scripts/server-smoke-test.sh'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to test, e.g. 26.3 or 1.21.11'
        required: true
        default: '26.3'
        type: string

permissions:
  contents: read

concurrency:
  group: server-test-${{ github.ref }}-${{ inputs.minecraft_version || 'default' }}
  cancel-in-progress: true

jobs:
  server-test:
    name: ${{ matrix.server }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [paper, spigot]
        version: ["${{ inputs.minecraft_version || '26.3' }}"]
    env:
      SERVER: ${{ matrix.server }}
      MC_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Minecraft 26.x needs Java 25. The plugin itself is still compiled for Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin jar
        run: mvn -B clean package

      - name: Download Paper
        if: matrix.server == 'paper'
        run: |
          mkdir -p server
          UA="CoManyWorld-server-test (https://github.com/$GITHUB_REPOSITORY)"
          curl -fsSL -A "$UA" -o builds.json \
            "https://fill.papermc.io/v3/projects/paper/versions/$MC_VERSION/builds"
          # Newest build of any channel: 26.x builds may still be marked BETA.
          IFS=$'\t' read -r BUILD CHANNEL URL SHA256 < <(jq -r '
            sort_by(.id) | last
            | [.id, .channel, .downloads["server:default"].url, .downloads["server:default"].checksums.sha256]
            | @tsv' builds.json)
          echo "Paper $MC_VERSION build $BUILD ($CHANNEL)"
          echo "SERVER_BUILD=Paper $MC_VERSION build $BUILD ($CHANNEL)" >> "$GITHUB_ENV"
          curl -fsSL -A "$UA" -o server/server.jar "$URL"
          echo "$SHA256  server/server.jar" | sha256sum -c -

      - name: Build Spigot with BuildTools
        if: matrix.server == 'spigot'
        run: |
          mkdir -p buildtools server
          cd buildtools
          curl -fsSL -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          if ! java -jar BuildTools.jar --rev "$MC_VERSION" --output-dir ../server > buildtools.log 2>&1; then
            tail -n 100 buildtools.log
            exit 1
          fi
          mv ../server/spigot-*.jar ../server/server.jar
          echo "SERVER_BUILD=Spigot $MC_VERSION (BuildTools)" >> "$GITHUB_ENV"

      - name: Run the plugin on the server
        run: |
          PLUGIN_JAR=$(ls target/CoManyWorld-*.jar)
          bash .github/scripts/server-smoke-test.sh server/server.jar "$PLUGIN_JAR" run

      - name: Summary
        if: always()
        run: |
          if [ -f run/console.log ]; then
            RUNNING_ON=$(grep -a -o 'Running on .*' run/console.log | head -n 1 || true)
          fi
          {
            echo "### $SERVER $MC_VERSION: ${{ job.status }}"
            echo "- Server: ${SERVER_BUILD:-not downloaded}"
            echo "- Plugin says: ${RUNNING_ON:-(plugin did not start)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.server }}-${{ matrix.version }}
          path: |
            run/console.log
            run/logs/
            run/plugins/CoManyWorld/*.yml
            buildtools/buildtools.log
          if-no-files-found: ignore
          retention-days: 14
