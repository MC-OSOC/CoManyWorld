# Starts real Paper and Spigot servers on GitHub's runner with the plugin installed,
# types the plugin's commands into the server console and checks the answers
# (create, list, backup, import, restart, delete, clear). See .github/scripts/server-smoke-test.sh
#
# The "upgrade" job first creates worlds on Paper 1.21.11, then checks they are still there,
# with the same blocks, on the new version.
#
# Runs on every push that changes the plugin, or by hand:
#   Actions -> Server test -> Run workflow -> Minecraft version (e.g. 26.3 or 1.21.11)
name: Server test

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/server-test.yml'
      - '.github/scripts/server-smoke-test.sh'
      - '.github/scripts/download-paper.sh'
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to test, e.g. 26.3 or 1.21.11'
        required: true
        default: '26.3'
        type: string

permissions:
  contents: read

concurrency:
  group: server-test-${{ github.ref }}-${{ inputs.minecraft_version || 'default' }}
  cancel-in-progress: true

jobs:
  server-test:
    name: ${{ matrix.server }} ${{ inputs.minecraft_version || '26.3' }}${{ matrix.upgrade_from && format(' (upgrade from {0})', matrix.upgrade_from) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: paper
          - server: spigot
          - server: paper
            upgrade_from: '1.21.11'
    env:
      SERVER: ${{ matrix.server }}
      MC_VERSION: ${{ inputs.minecraft_version || '26.3' }}
      UPGRADE_FROM: ${{ matrix.upgrade_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Minecraft 26.x needs Java 25. The plugin itself is still compiled for Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin jar
        run: mvn -B clean package

      - name: Download Paper
        if: matrix.server == 'paper'
        run: |
          BUILD=$(bash .github/scripts/download-paper.sh "$MC_VERSION" server/server.jar)
          echo "$BUILD"
          if [ -n "$UPGRADE_FROM" ]; then
            OLD=$(bash .github/scripts/download-paper.sh "$UPGRADE_FROM" server/old-server.jar)
            echo "$OLD"
            BUILD="$OLD -> $BUILD"
          fi
          echo "SERVER_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Build Spigot with BuildTools
        if: matrix.server == 'spigot'
        run: |
          mkdir -p buildtools server
          cd buildtools
          curl -fsSL -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          if ! java -jar BuildTools.jar --rev "$MC_VERSION" --output-dir ../server > buildtools.log 2>&1; then
            tail -n 100 buildtools.log
            exit 1
          fi
          mv ../server/spigot-*.jar ../server/server.jar
          echo "SERVER_BUILD=Spigot $MC_VERSION (BuildTools)" >> "$GITHUB_ENV"

      - name: Run the plugin on the server
        run: |
          PLUGIN_JAR=$(ls target/CoManyWorld-*.jar)
          ARGS=(server/server.jar "$PLUGIN_JAR" run)
          if [ -n "$UPGRADE_FROM" ]; then
            ARGS+=(server/old-server.jar)
          fi
          bash .github/scripts/server-smoke-test.sh "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          if [ -f run/console.log ]; then
            RUNNING_ON=$(grep -a -o 'Running on .*' run/console.log | tail -n 1 || true)
          fi
          {
            echo "### $SERVER $MC_VERSION${UPGRADE_FROM:+ (upgrade from $UPGRADE_FROM)}: ${{ job.status }}"
            echo "- Server: ${SERVER_BUILD:-not downloaded}"
            echo "- Plugin says: ${RUNNING_ON:-(plugin did not start)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.server }}${{ matrix.upgrade_from && '-upgrade' || '' }}-${{ env.MC_VERSION }}
          path: |
            run/console.log
            run/logs/
            run/plugins/CoManyWorld/*.yml
            buildtools/buildtools.log
          if-no-files-found: ignore
          retention-days: 14
